<!DOCTYPE html>
<html lang="en">
<head>

  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root{--teal:#354d4c;--gold:#cc9924;--beige:#d3cdb3;--offwhite:#f9f8f5;--ink:#1a1a18;--ink-soft:#4a4a46}
    *{box-sizing:border-box}
    body{font-family:'Roboto',sans-serif;font-weight:300;color:var(--ink);background:var(--offwhite);line-height:1.7;-webkit-font-smoothing:antialiased;margin:0}
    h1,h2{font-family:'Marcellus',Georgia,serif;font-weight:400;letter-spacing:-.02em}
    a{color:var(--gold);text-decoration:none}
    img{max-width:100%;display:block}
    .container{max-width:780px;margin:0 auto;padding:0 24px}
    .gold-rule{width:40px;height:2px;background:var(--gold);margin:14px auto 22px}

    header{background:var(--ink);padding:36px 0 44px;text-align:center;color:#fff}
    header img{height:56px;width:auto;margin:0 auto 28px}
    header h1{font-size:clamp(26px,3.4vw,38px);line-height:1.2;color:#fff;margin:0 0 10px}
    header p{font-size:15.5px;color:rgba(255,255,255,.75);margin:0 auto;max-width:520px;font-weight:300}

    .cal{padding:48px 0 56px}
    .cal-card{background:#fff;border:1px solid var(--beige);box-shadow:0 12px 48px rgba(53,77,76,.08);padding:14px}
    .cal-card iframe{display:block;width:100%;border:0;min-height:720px}

    footer{background:var(--ink);color:rgba(255,255,255,.45);padding:28px 0;font-size:12px;text-align:center;border-top:1px solid rgba(255,255,255,.06)}
    footer a{color:rgba(255,255,255,.6)}
  </style>
</head>
<body>

<header>
  <div class="container">
    <a href="https://alchemyofbreath.com/" aria-label="Alchemy of Breath">
      <img src="https://assets.cdn.filesafe.space/5lz2Wm44CNDwLSZWgAPf/media/69fa2fe0101c593bfc7dc55a.png" alt="Alchemy of Breath" />
    </a>
    <div class="gold-rule"></div>
    <h1>Reschedule your call</h1>
    <p>Life happens. Pick a new time below and we'll update everything on our end.</p>
  </div>
</header>

<section class="cal">
  <div class="container">
    <div class="cal-card">
      <iframe src="https://link.alchemyofbreath.com/widget/booking/nqi9d8dd3lS6nCTgGIbU" scrolling="no" id="nqi9d8dd3lS6nCTgGIbU_1779906996246" title="Reschedule your call"></iframe>
    </div>
  </div>
</section>

<footer>
  <div class="container">
    <p>&copy; 2026 Alchemy of Breath &middot; <a href="https://alchemyofbreath.com/">Visit the main site</a> &middot; <a href="mailto:info@alchemyofbreath.com">info@alchemyofbreath.com</a></p>
