<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reschedule Your Call — Alchemy of Breath</title>
  <meta name="description" content="Pick a new time for your discovery call with Alchemy of Breath."/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Khula:wght@300;400;600&family=Cormorant+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet"/>

  <style>
  :root {
    --bg:       #F7F4EF;
    --teal:     #00a5b2;
    --ink:      #221F20;
    --ink-soft: #3d3a3b;
    --muted:    #7a8a8e;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Khula', system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 24px 64px;
    -webkit-font-smoothing: antialiased;
  }

  .header {
    text-align: center;
    max-width: 520px;
    margin-bottom: 36px;
  }
  .header h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 400;
    font-size: clamp(28px, 4vw, 40px);
    line-height: 1.2;
    margin-bottom: 8px;
  }
  .header h1 em {
    font-style: italic;
    color: var(--teal);
  }
  .header p {
    font-size: 16px;
    color: var(--ink-soft);
    line-height: 1.5;
  }

  .booking-wrap {
    width: 100%;
    max-width: 720px;
  }
  .booking-wrap iframe {
    width: 100%;
    min-height: 700px;
    border: none;
  }

  .footer-note {
    margin-top: 40px;
    font-size: 13px;
    color: var(--muted);
    text-align: center;
  }
  .footer-note a {
    color: var(--teal);
    text-decoration: none;
  }
  .footer-note a:hover {
    text-decoration: underline;
  }
  </style>
</head>
<body>

  <div class="header">
    <h1>Let's find a <em>better</em> time</h1>
    <p>No need to explain. Life moves. Pick a new slot below and we will be there.</p>
  </div>

  <div class="booking-wrap">
    <iframe
      src="https://link.alchemyofbreath.com/widget/booking/nqi9d8dd3lS6nCTgGIbU"
      scrolling="no"
      id="nqi9d8dd3lS6nCTgGIbU_1779906996246"
      title="Reschedule your discovery call"></iframe>
    <script src="https://link.alchemyofbreath.com/js/form_embed.js" type="text/javascript"></script>
  </div>

  <p class="footer-note">
    Questions? Reply to any email from us or write to
    <a href="mailto:hello@alchemyofbreath.com">hello@alchemyofbreath.com</a>
  </p>

</body>
</html>
