<section class="section" style="background:var(--bg-warm);">

    <h2 style="text-align:center;">{{content.outcomes.heading}}</h2>
    <ul style="list-style:none;padding:0;margin:2rem 0 0;display:grid;gap:0.75rem;">
      {{#content.outcomes.items}}

      {{/content.outcomes.items}}
    </ul>
  </div>
</section>
