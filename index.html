  <style>
  /* ────────────────────────────────────────────
     TOKENS
  ──────────────────────────────────────────── */
  :root {
    --bg:         #F7F4EF;
    --bg-warm:    #F0EBE1;
    --bg-teal:    #EBF5F6;
    --gold:       #E1B668;
    --gold-2:     #D6A652;
    --teal:       #00a5b2;
    --teal-mid:   #5b7889;
    --teal-pale:  #d0ebee;
    --ink:        #221F20;
    --ink-soft:   #3d3a3b;
    --muted:      #7a8a8e;
    --white:      #ffffff;
    --shadow-sm:  0 2px 20px rgba(34,31,32,0.06);
    --shadow-md:  0 8px 40px rgba(34,31,32,0.10);
    --shadow-lg:  0 20px 60px rgba(34,31,32,0.12);
  }

  /* ────────────────────────────────────────────
     TRUST STRIP — "As featured in"
  ──────────────────────────────────────────── */
  .trust-strip {
    background: var(--bg);
    padding: 56px 24px 64px;
    border-top: 1px solid rgba(34,31,32,0.06);
    border-bottom: 1px solid rgba(34,31,32,0.06);
    text-align: center;
    overflow: hidden;
  }
  .trust-strip .eyebrow {
    font-family: 'Khula', sans-serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 32px;
  }
  .logo-strip {
    position: relative;
    width: 100%;
    overflow: hidden;
    mask-image: linear-gradient(to right, transparent 0, #000 8%, #000 92%, transparent 100%);
    -webkit-mask-image: linear-gradient(to right, transparent 0, #000 8%, #000 92%, transparent 100%);
  }
  .logo-track {
    display: flex;
    align-items: center;
    gap: 64px;
    width: max-content;
    animation: logo-scroll 48s linear infinite;
  }
  .logo-strip:hover .logo-track { animation-play-state: paused; }
  .logo-track .l {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 56px;
  }
  .logo-track .l img {
    max-height: 100%;
    max-width: 160px;
    width: auto;
    object-fit: contain;
    filter: grayscale(100%);
    opacity: 0.55;
    transition: filter 0.3s ease, opacity 0.3s ease;
  }
  .logo-track .l img:hover {
    filter: grayscale(0%);
    opacity: 1;
  }
  @keyframes logo-scroll {
    from { transform: translateX(0); }
    to   { transform: translateX(-50%); }
  }
  @media (prefers-reduced-motion: reduce) {
    .logo-track { animation: none; }
  }
  @media (max-width: 640px) {
    .trust-strip { padding: 40px 16px 48px; }
    .logo-track { gap: 40px; }
    .logo-track .l { height: 40px; }
    .logo-track .l img { max-width: 120px; }
  }
  </style>
